[project]
name = "openfinder-video-analyzer-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3", "typing-extensions>=4.15"]

[dependency-groups]
dev = [
  "basedpyright>=1.31",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
include = ["video_analyzer_worker", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S108", "PLR2004"]
"../run.py" = ["S603"]
"video_analyzer_worker/models.py" = ["TC003"]
"video_analyzer_worker/plugin_adapter.py" = ["TC003"]
